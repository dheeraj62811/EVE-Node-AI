name: Run EVE-Node Pipeline & Benchmarks

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Signal Processing Experiments
      run: |
        python -m signal_processing.evaluate_experiments

    - name: Run Autonomous Agent Controller
      run: |
        python agent_controller.py

    - name: Run Quantitative Benchmark
      run: |
        python benchmark.py
